<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ECS Features — Showroom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #f2f2f2;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  /* ---- Page canvas: fixed 1680, centered ---- */
  .stage {
    width: 1680px;
    margin: 0 auto;
    position: relative;
  }

  .page {
    position: relative;
    width: 1680px;
    display: none;
  }

  .page.active { display: block; }

  .page > .bg {
    display: block;
    width: 1680px;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }

  .page .overlay {
    position: absolute;
  }

  /* Hero background drawn in code. Two modes:
     - hero.text set: opaque gradient, transparent text PNG on top
     - no text: the bg PNG holds the hero text on white, the gradient multiplies over it */
  .page .hero-bg,
  .page .hero-text {
    position: absolute;
    left: 0;
    width: 1680px;
    pointer-events: none;
  }
  .page .hero-bg.multiply { mix-blend-mode: multiply; }
  .page .hero-text { display: block; user-select: none; -webkit-user-drag: none; }

  .page .overlay img {
    display: block;
    width: 100%;
    height: 100%;
    user-select: none;
    -webkit-user-drag: none;
    transition: filter 0.2s ease, opacity 0.2s ease;
  }

  /* Blur the card on hover, letting the light page show through (frosted look) */
  .overlay:hover img { filter: blur(7px); opacity: 0.55; }

  /* Download button, centered, appears on overlay hover */
  .overlay .dl {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    background: #15171f;
    color: #fff;
    font: 600 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    text-decoration: none;
    box-shadow: 0 10px 28px rgba(0,0,0,0.3);
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.94);
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.2s cubic-bezier(0.3, 0.9, 0.3, 1),
                border-color 0.15s;
  }

  .overlay:hover .dl {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
  }

  .overlay .dl:hover {
    background: #23262f;
    border-color: rgba(255,255,255,0.22);
  }

  .overlay .dl svg { width: 12px; height: 12px; flex: none; }

  /* ---- Bottom page switcher (drop-up) ---- */
  .switcher {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    font: 500 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  .switcher .trigger {
    display: flex;
    align-items: center;
    gap: 34px;
    min-width: 260px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(17, 19, 26, 0.88);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    color: #fff;
    padding: 14px 18px 14px 20px;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
    transition: border-color 0.15s, background 0.15s;
  }

  .switcher .trigger:hover { border-color: rgba(255,255,255,0.18); }

  .switcher .trigger .label {
    flex: 1;
    text-align: left;
    white-space: nowrap;
  }

  .switcher .trigger .hint {
    color: rgba(255,255,255,0.35);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .switcher .trigger .chevron {
    width: 10px;
    height: 10px;
    flex: none;
    transition: transform 0.25s cubic-bezier(0.3, 0.9, 0.3, 1);
  }

  .switcher.open .trigger .chevron { transform: rotate(180deg); }

  .switcher .menu {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 0;
    right: 0;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(17, 19, 26, 0.92);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border-radius: 14px;
    padding: 6px;
    box-shadow: 0 18px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    opacity: 0;
    transform: translateY(8px) scale(0.98);
    transform-origin: bottom center;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.22s cubic-bezier(0.3, 0.9, 0.3, 1);
  }

  .switcher.open .menu {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .switcher .menu button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: 0;
    background: transparent;
    color: rgba(255,255,255,0.72);
    font: inherit;
    text-align: left;
    padding: 11px 12px;
    border-radius: 9px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.12s, color 0.12s;
  }

  .switcher .menu button:hover {
    background: rgba(255,255,255,0.08);
    color: #fff;
  }

  .switcher .menu button .dot {
    width: 6px;
    height: 6px;
    flex: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    transition: background 0.12s, box-shadow 0.12s;
  }

  .switcher .menu button.active {
    color: #fff;
    background: rgba(255,255,255,0.06);
  }

  .switcher .menu button.active .dot {
    background: #4ade80;
    box-shadow: 0 0 8px rgba(74, 222, 128, 0.7);
  }

  /* "New" label on recently added pages (menu items + trigger) */
  .switcher .new {
    margin-left: auto;
    padding: 4px 7px;
    border-radius: 6px;
    background: rgba(74, 222, 128, 0.16);
    color: #4ade80;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    line-height: 1;
    text-transform: uppercase;
  }

  .switcher .trigger .label .new { margin-left: 10px; vertical-align: 1px; }

  /* ---- Preloader ---- */
  .loader {
    position: fixed;
    inset: 0;
    z-index: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: #101218;
    color: #fff;
    transition: opacity 0.45s ease;
  }

  .loader.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .loader .title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
  }

  .loader .percent {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .loader .bar {
    width: 260px;
    height: 3px;
    border-radius: 999px;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
  }

  .loader .bar .fill {
    display: block;
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: #4ade80;
    box-shadow: 0 0 12px rgba(74, 222, 128, 0.6);
    transition: width 0.25s ease;
  }

  /* ---- Small screen warning ---- */
  .size-warning {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 200;
    background: #f5e6b8;
    color: #5c4a12;
    font-size: 14px;
    line-height: 1.4;
    text-align: center;
    padding: 12px 20px;
  }

  .size-warning strong { font-weight: 600; }

  /* ---- Zoom toggle (like the page switcher, bottom-right) ---- */
  .zoom-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 100;
    display: none;
    align-items: center;
    gap: 14px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(17, 19, 26, 0.88);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    color: #fff;
    font: 500 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    padding: 14px 18px;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
    transition: border-color 0.15s;
  }

  .zoom-toggle:hover { border-color: rgba(255,255,255,0.18); }

  .zoom-toggle .hint {
    color: rgba(255,255,255,0.35);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* Only shown when the viewport is narrower than the fixed 1480px view */
  body.narrow .zoom-toggle { display: flex; }

  /* Narrower than the 1680px canvas: crop evenly (margin is set from JS) */
  @media (max-width: 1679px) {
    body { overflow-x: hidden; }
  }

  @media (max-width: 1439px) {
    body.zoom-100 .size-warning { display: block; }
  }
</style>

        { src: "images/document-management/hero.svg",
          x: 760, y: 127, w: 800, h: 720 },
        { src: "images/document-management/start-every-portal-from-a-proven-best-practice-template.svg",
          x: 240, y: 2475, w: 570, h: 564 },
        { src: "images/document-management/ai-powered-search-for-board-documents.svg",
          x: 840, y: 3305, w: 540, h: 540 },
        { src: "images/document-management/import-documents-in-batch.svg",
          x: 240, y: 4109, w: 570, h: 570 },
        { src: "images/document-management/decide-who-can-print-download-or-just-read-each-file.svg",
          x: 870, y: 4913, w: 570, h: 570 },
      ],
    },
  ];

  const stage = document.getElementById("stage");
  const switcher = document.getElementById("switcher");
  const trigger = document.getElementById("trigger");
  const triggerLabel = document.getElementById("triggerLabel");
  const menu = document.getElementById("menu");
  const loader = document.getElementById("loader");
  const loaderPercent = document.getElementById("loaderPercent");
  const loaderFill = document.getElementById("loaderFill");

  // ---- Preloader: load everything upfront ----
  const totalAssets = PAGES.reduce((n, p) => n + 1 + p.items.length + (p.hero?.text ? 1 : 0), 0);
  let loadedAssets = 0;

  function assetDone() {
    loadedAssets++;
    const pct = Math.round(loadedAssets / totalAssets * 100);
    loaderPercent.textContent = pct + "%";
    loaderFill.style.width = pct + "%";
    if (loadedAssets >= totalAssets) {
      setTimeout(() => loader.classList.add("hidden"), 350);
    }
  }

  function trackImg(img, src) {
    img.addEventListener("load", assetDone);
    img.addEventListener("error", assetDone); // don't hang forever on a broken file
    img.src = encodeURI(src);
  }

  // "Q&A" → "q-and-a"
  const slug = str => str.toLowerCase().replace(/&/g, " and ").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  // Download as product-page-visual.svg so a client can tell files apart (every page has a hero.svg)
  function downloadName(page, src) {
    const file = src.split("/").pop();
    const prefix = slug(page.product) + "-" + slug(page.name);
    return file.startsWith(prefix) ? file : prefix + "-" + file;
  }

  PAGES.forEach((page, i) => {
    // page container
    const el = document.createElement("div");
    el.className = "page" + (i === 0 ? " active" : "");
    el.dataset.index = i;

    const bg = document.createElement("img");
    bg.className = "bg";
    bg.alt = page.name;
    trackImg(bg, page.bg);
    el.appendChild(bg);

    if (page.hero) {
      const hero = document.createElement("div");
      hero.className = "hero-bg";
      hero.style.top = page.hero.y + "px";
      hero.style.height = page.hero.h + "px";
      hero.style.background = page.hero.background;
      if (!page.hero.text) hero.classList.add("multiply");
      el.appendChild(hero);

      if (page.hero.text) {
        const text = document.createElement("img");
        text.className = "hero-text";
        text.alt = "";
        text.style.top = page.hero.y + "px";
        text.style.height = page.hero.h + "px";
        trackImg(text, page.hero.text);
        el.appendChild(text);
      }
    }

    page.items.forEach(item => {
      const wrap = document.createElement("div");
      wrap.className = "overlay";
      wrap.style.left = item.x + "px";
      wrap.style.top = item.y + "px";
      wrap.style.width = item.w + "px";
      wrap.style.height = item.h + "px";

      const img = document.createElement("img");
      img.alt = "";
      trackImg(img, item.src);
      wrap.appendChild(img);

      const dl = document.createElement("a");
      dl.className = "dl";
      dl.href = encodeURI(item.src);
      dl.download = downloadName(page, item.src);
      dl.innerHTML =
        '<svg viewBox="0 0 12 12" fill="none" aria-hidden="true">' +
        '<path d="M6 1v7M3 5.5 6 8.5 9 5.5M1.5 11h9" stroke="currentColor" ' +
        'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        'Download SVG';
      wrap.appendChild(dl);

      el.appendChild(wrap);
    });

    stage.appendChild(el);

    // dropdown item
    const btn = document.createElement("button");
    btn.setAttribute("role", "option");
    btn.className = i === 0 ? "active" : "";
    btn.innerHTML = '<span class="dot"></span>';
    btn.appendChild(document.createTextNode(page.name));
    if (page.isNew) btn.insertAdjacentHTML("beforeend", '<span class="new">New</span>');
    btn.addEventListener("click", () => {
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      menu.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      el.classList.add("active");
      btn.classList.add("active");
      setTriggerLabel(page);
      closeMenu();
      window.scrollTo(0, 0);
    });
    menu.appendChild(btn);
  });

  function setTriggerLabel(page) {
    triggerLabel.textContent = page.name;
    if (page.isNew) triggerLabel.insertAdjacentHTML("beforeend", '<span class="new">New</span>');
  }
  setTriggerLabel(PAGES[0]);

  function openMenu() {
    switcher.classList.add("open");
    trigger.setAttribute("aria-expanded", "true");
  }
  function closeMenu() {
    switcher.classList.remove("open");
    trigger.setAttribute("aria-expanded", "false");
  }

  trigger.addEventListener("click", (e) => {
    e.stopPropagation();
    switcher.classList.contains("open") ? closeMenu() : openMenu();
  });

  document.addEventListener("click", (e) => {
    if (!switcher.contains(e.target)) closeMenu();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeMenu();
  });

  // ---- Zoom ----
  // 1680..1480px: canvas is cropped evenly on both sides (design margins).
  // Below 1480px: the central 1480px view is fixed and scaled to the window.
  const zoomToggle = document.getElementById("zoomToggle");
  const zoomLabel = document.getElementById("zoomLabel");
  const CANVAS_W = 1680; // full canvas width
  const FIT_W = 1480;    // fixed view width that must stay fully visible
  let fitMode = true;

  function applyZoom() {
    const w = window.innerWidth;
    const narrow = w < FIT_W;
    document.body.classList.toggle("narrow", narrow);
    document.body.classList.toggle("zoom-100", !fitMode);

    const s = (fitMode && narrow) ? w / FIT_W : 1;
    stage.style.zoom = s;
    // Center the canvas, cropping both sides evenly (value is in zoomed px)
    stage.style.marginLeft = w < CANVAS_W ? ((w - CANVAS_W * s) / 2 / s) + "px" : "";

    zoomLabel.textContent = (fitMode && narrow)
      ? "Fit \u00b7 " + Math.round(s * 100) + "%"
      : "100%";
    zoomToggle.setAttribute("aria-pressed", String(fitMode));
  }

  zoomToggle.addEventListener("click", () => {
    fitMode = !fitMode;
    applyZoom();
  });

  window.addEventListener("resize", applyZoom);
  applyZoom();
</script>

</body>
</html>
